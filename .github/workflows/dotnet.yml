name: .NET build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore dotNet8BMISample.sln

      - name: Build
        run: dotnet build dotNet8BMISample.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test dotNet8BMISample.sln --configuration Release --no-build --verbosity normal
